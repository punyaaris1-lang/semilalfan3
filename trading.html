<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis XAU/USD (Gemini 3.5)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        button { padding: 14px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
        button:disabled { background: #94a3b8; }
        #result { margin-top: 15px; padding: 15px; background: #f1f5f9; border-radius: 8px; font-size: 13px; text-align: left; white-space: pre-wrap; display: none; border: 1px solid #cbd5e1; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Analisis Chart XAU/USD</h3>
        <p style="font-size: 12px; color: #64748b; margin-top: -10px;">Powered by Gemini 3.5 Flash</p>
        <input type="file" id="imageInput" accept="image/jpeg, image/png" style="margin-bottom: 15px; width: 100%;">
        <button id="analyzeBtn" disabled>Analisis Sekarang</button>
        <div id="result">Menganalisis pola grafik...</div>
    </div>
    <script>
        // API Key AQ sudah terpasang
        const MY_GEMINI_API_KEY = "AQ.Ab8RN6KUu-y_3DLQywHGIQg9RNEet_HLSRdCyvxLAx281LZ_fQ";

        const imageInput = document.getElementById('imageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultDiv = document.getElementById('result');
        let base64Image = '';

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result.split(',')[1];
                    analyzeBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        analyzeBtn.addEventListener('click', async function() {
            analyzeBtn.disabled = true;
            resultDiv.style.display = 'block';
            resultDiv.innerText = "Memproses data ke server... mohon tunggu.";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${MY_GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { 
                                    // PERUBAHAN DI SINI: Prompt dipaksa sangat ketat dan singkat
                                    text: "Bertindaklah sebagai bot asisten trading profesional khusus XAU/USD. Analisa chart ini dan berikan hasil SANGAT SINGKAT, langsung ke intinya (to the point) tanpa basa-basi atau penjelasan panjang. Gunakan format persis seperti ini:\n\n📈 TREN: [Bullish/Bearish/Sideways]\n🔍 POLA: [Sebutkan 1-2 pola utama secara singkat]\n🛡️ SUPPORT: [Sebutkan 1-2 angka kunci]\n⚔️ RESISTANCE: [Sebutkan 1-2 angka kunci]\n⚡ ENTRY: [Buy/Sell di area X, SL di Y, TP di Z]" 
                                },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                
                resultDiv.innerText = "Sinyal Terdeteksi:\n\n" + data.candidates[0].content.parts[0].text;
                
            } catch (error) {
                resultDiv.innerText = "ERROR:\n" + error.message;
            } finally {
                analyzeBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
